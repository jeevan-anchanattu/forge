name: Deploy to GitHub Pages (Dev)

on:
  push:
    branches:
      - dev

# Required permissions for the native GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Check out the repository code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build the Vite app
      #    VITE_MOCK_API=true ensures the app uses mock data in the dev environment.
      #    The vite.config.ts sets base='/forge/' automatically for production builds.
      #    Note: build:ci uses vite build only (skips tsc) due to pre-existing TS errors.
      - name: Build
        run: npm run build:ci
        env:
          VITE_MOCK_API: true
          VITE_MOCK_DELAY_MS: 400
          VITE_API_BASE_URL: /api/v1/

      # 5. Prevent Jekyll from building (avoids duplicate github-pages artifact conflict)
      - name: Disable Jekyll
        run: touch ./dist/.nojekyll

      # 6. Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 6. Upload the dist/ folder as a Pages artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # 7. Deploy to GitHub Pages via the native GitHub Actions mechanism
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
